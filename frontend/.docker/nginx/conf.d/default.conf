server {
    listen 80;
    server_name _;
    root /var/www/public/;
    index index.html;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /static {
        alias /var/www/public/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}