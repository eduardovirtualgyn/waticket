version: '3.8'

networks:
  whaticket:
    driver: bridge

volumes:
  mysql_data:
  backend_public:
  wwebjs_auth:
  zapo_auth:

services:

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    restart: always
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3002}:80"
    environment:
      - REACT_APP_BACKEND_URL=${BACKEND_URL:-http://localhost:8082}
      - VITE_BACKEND_URL=${BACKEND_URL:-http://localhost:8082}
    networks:
      - whaticket

  backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    restart: always
    depends_on:
      - mysql
    environment:
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASS=${MYSQL_ROOT_PASSWORD:-strongpassword}
      - DB_NAME=${MYSQL_DATABASE:-whaticket}
      - JWT_SECRET=${JWT_SECRET:-3123123213123}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-75756756756}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8082}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3002}
      - CHROME_ARGS=--no-sandbox --disable-setuid-sandbox
    ports:
      - "${BACKEND_PORT:-8082}:3000"
    volumes:
      - backend_public:/usr/src/app/public
      - wwebjs_auth:/usr/src/app/.wwebjs_auth
      - zapo_auth:/usr/src/app/.zapo_auth
    networks:
      - whaticket

  mysql:
    image: ${MYSQL_ENGINE:-mariadb}:${MYSQL_VERSION:-10.6}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_bin
    restart: always
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-whaticket}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-strongpassword}
      - TZ=${TZ:-America/Fortaleza}
    volumes:
      - mysql_data:/var/lib/mysql
    expose:
      - "3306"
    networks:
      - whaticket